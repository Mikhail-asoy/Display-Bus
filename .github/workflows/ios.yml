name: Build iOS
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: inti-busdisplay-main
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Siapkan konfigurasi iOS
        run: flutter build ios --release --config-only --no-codesign
      - name: Build dengan xcodebuild
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios_build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Buat IPA
        run: |
          mkdir Payload
          cp -r build/ios_build/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -r app.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: inti-busdisplay-main/app.ipa
